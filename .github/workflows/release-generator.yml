name: Release gi-stub-gen
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable generator version, for example 0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gi-generator-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Prepare, verify and publish generator
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/pip" install packaging tomlkit uv==0.13.5
          export PATH="$RUNNER_TEMP/release-venv/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          gh auth setup-git
          python -m gi_stub_gen.publish generator --version "$RELEASE_VERSION"
      - name: Retain prepared artifacts and verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generator-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gi-release/assets/
            ${{ runner.temp }}/gi-release/**/.release-logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
  index:
    # A release created with GITHUB_TOKEN does not trigger a separate release-event workflow.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gi-wheel-index-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: pages
        uses: ./.github/actions/publish-index
